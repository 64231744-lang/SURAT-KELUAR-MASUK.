  :root{
    --navy-950:#0e1a2e;
    --navy-900:#132845;
    --navy-800:#1b3660;
    --navy-700:#264a80;
    --maroon-900:#3d0f0f;

    --gold-600:#a8841c;
    --gold-100:#f6ecc9;
    --paper:#f6f4ee;
    --paper-2:#ffffff;

    --blue-100:#e4eef8;

  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 400px at 50% -120px, rgba(27,54,96,.06), transparent),
      var(--paper);
    color:var(--ink-900);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-100);}

  /* ---------- Letterhead ---------- */

      radial-gradient(500px 220px at 96% 100%, rgba(201,162,39,.10), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 14px),
      linear-gradient(180deg,var(--maroon-800),var(--maroon-900));
    color:#eef1f6;
    padding:22px 28px 18px;
    position:relative;
    overflow:hidden;
  }

  .letterhead::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:6px;
    background:linear-gradient(90deg,var(--gold-600),var(--gold-500) 20%, var(--gold-500) 80%, var(--gold-600));
  }
  .letterhead-inner{
    max-width:1240px; margin:0 auto;
    display:flex; align-items:center; gap:16px;
    position:relative; z-index:1;
  }
  .seal{
    width:80px;height:80px;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    overflow:visible;
  }
  .seal img{
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .letterhead h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:21px;
    margin:0;
    letter-spacing:.3px;
  }
  .letterhead p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#aebbd0;
    letter-spacing:.4px;
  }
  .letterhead .yr{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--gold-100);
    border:1px solid rgba(201,162,39,.5);
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* ---------- Shell ---------- */
  .shell{max-width:1240px;margin:0 auto;padding:22px 28px 70px;}

  /* ---------- Stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .stat{
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; box-shadow:var(--shadow);
  }
  .stat .n{font-family:'Source Serif 4',serif; font-size:24px; font-weight:700; color:var(--navy-900); line-height:1.1;}
  .stat .l{font-size:11px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; font-weight:600;}
  @media (max-width:760px){ .stats{grid-template-columns:repeat(2,1fr);} }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex; gap:2px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:'Inter'; font-weight:600; font-size:13.5px;
    color:var(--ink-600); white-space:nowrap;
    padding:11px 4px; margin-right:22px;
    border-bottom:2.5px solid transparent;
    position:relative; top:1px;
    display:flex; align-items:center; gap:8px;
  }
  .tab .count{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    background:#eee7d4; color:var(--ink-600);
    border-radius:999px; padding:1px 7px;
  }
  .tab.active{color:var(--navy-900); border-bottom-color:var(--gold-500);}
  .tab.active .count{background:var(--navy-900); color:var(--gold-100);}
  .tab-sub{font-size:10.5px; color:var(--ink-400); font-weight:500;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-400);}
  .field input, .field select{
    font-family:'Inter'; font-size:13.5px; color:var(--ink-900);
    border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; background:#fff;
    min-width:150px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(38,74,128,.12);}
  .field.search{min-width:230px; flex:1;}
  .field.search input{width:100%;}
  .btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px;
    border-radius:8px; padding:9px 15px; cursor:pointer;
    border:1px solid transparent; display:inline-flex; align-items:center; gap:7px;
    transition:filter .12s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy-900); color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-gold{background:var(--gold-500); color:#241d05;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-ghost{background:#fff; color:var(--ink-600); border-color:var(--line);}
  .btn-ghost:hover{background:#f2efe4;}
  .btn-danger{background:#fff; color:var(--red-700); border-color:#e6c9c6;}
  .btn-danger:hover{background:var(--red-100);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}
  .spacer{flex:1;}

  /* ---------- Table card ---------- */
  .card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; min-width:960px;}
  thead th{
    text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-400); background:#faf8f2;
    padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{
    padding:11px 12px; font-size:13.5px; border-bottom:1px solid #ece7d8;
    vertical-align:top; color:var(--ink-900);
  }
  tbody tr:hover{background:#fbf9f2;}
  tbody tr:last-child td{border-bottom:none;}
  .no-cell{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-400); width:36px;}
  .mono{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--navy-800);}
  .perihal{max-width:280px;}
  .perihal .sub{color:var(--ink-400); font-size:11.5px; margin-top:2px;}
  .periode-pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--blue-100); color:var(--blue-700); white-space:nowrap;
  }
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px;height:22px; border-radius:6px; font-size:12px; font-weight:700;
  }
  .badge.yes{background:var(--green-100); color:var(--green-700);}
  .badge.no{background:#f1eee2; color:var(--ink-400);}
  .disp-cell{max-width:190px; font-size:12.5px; color:var(--ink-600); word-break:break-word;}
  .link-cell{max-width:190px; font-size:12.5px; word-break:break-word;}
  .link-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; font-weight:600; color:var(--navy-800);
    background:var(--blue-100); border:1px solid #cfe0f0;
    padding:4px 9px; border-radius:7px; text-decoration:none;
    max-width:100%;
  }
  .link-pill:hover{background:var(--blue-700); color:#fff; border-color:var(--blue-700);}
  .link-pill .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px;}
  .link-empty{color:var(--ink-400);}
  .rowbtns{display:flex; gap:6px;}
  .iconbtn{
    border:1px solid var(--line); background:#fff; border-radius:7px; width:28px;height:28px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-600);
  }
  .iconbtn:hover{background:#f2efe4;}
  .iconbtn.del:hover{background:var(--red-100); color:var(--red-700); border-color:#e6c9c6;}

  .empty{padding:60px 20px; text-align:center; color:var(--ink-400);}
  .empty .glyph{font-size:34px; margin-bottom:8px; opacity:.6;}
  .empty b{color:var(--ink-600);}

  .footerbar{
    display:flex; align-items:center; gap:10px; padding:11px 16px;
    border-top:1px solid var(--line); background:#faf8f2;
    font-size:12px; color:var(--ink-400); flex-wrap:wrap;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(14,26,46,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:640px;
    box-shadow:0 20px 60px -12px rgba(14,26,46,.4);
    animation:pop .15s ease-out;
  }
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.99);} to{opacity:1; transform:none;}}
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{margin:0; font-family:'Source Serif 4',serif; font-size:18px; color:var(--navy-900);}
  .modal-head .sub{font-size:11.5px; color:var(--ink-400); margin-top:2px;}
  .modal-head button{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-400); line-height:1;}
  .modal-body{padding:20px 22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-body .full{grid-column:1 / -1;}
  .modal-body label{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-400); margin-bottom:5px;}
  .modal-body input[type=text], .modal-body input[type=date], .modal-body select{
    width:100%; font-family:'Inter'; font-size:13.5px; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink-900);
  }
  .modal-body input:focus, .modal-body select:focus{outline:none; border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(38,74,128,.12);}
  .checkgroup{grid-column:1/-1; border:1px dashed var(--line); border-radius:10px; padding:12px 14px; background:#faf8f2;}
  .checkgroup>span{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-400); margin-bottom:9px;}
  .chk-row{display:flex; flex-wrap:wrap; gap:14px;}
  .chk{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-900); cursor:pointer;}
  .chk input{width:16px;height:16px; accent-color:var(--navy-800); cursor:pointer;}
  .modal-foot{
    padding:16px 22px; border-top:1px solid var(--line);
    display:flex; justify-content:flex-end; gap:8px;
  }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--navy-950); color:#fff; padding:10px 18px; border-radius:9px;
    font-size:13px; box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:100;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .toast .dot{width:7px;height:7px;border-radius:50%; background:var(--gold-500);}

  @media (max-width:640px){
    .letterhead h1{font-size:16px;}
    .letterhead p{font-size:11px;}
    .shell{padding:16px 14px 60px;}
    .modal-body{grid-template-columns:1fr;}
    .field{min-width:0; flex:1 1 45%;}
    .field.search{flex-basis:100%;}
    .stats{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function getDispositionsField(s){ return s.fields.find(f=>f.type==='dispositions'); }

/* =========================================================
   STORAGE (persistent, shared across users of this artifact)
   ========================================================= */
async function loadAll(){
  for (const tab of Object.keys(SCHEMAS)){
    try{
      const res = await window.storage.get(SCHEMAS[tab].storageKey, true);
      if (res && res.value){
        state[tab] = JSON.parse(res.value);
      } else {
        // Belum ada data tersimpan -> isi awal dengan data asli dari Excel
        state[tab] = SEED_DATA[tab].map((row,i)=> ({...row, id: uid(), no: i+1}));
        await persist(tab);
      }
    }catch(e){
      state[tab] = [];
    }
  }
}

async function persist(tab){
  try{
    await window.storage.set(SCHEMAS[tab].storageKey, JSON.stringify(state[tab]), true);
  }catch(e){
    showToast("Gagal menyimpan — coba lagi");
    console.error(e);
  }
}

async function init(){
  const bulanSel = document.getElementById('fBulan');

function buildTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TAB_ORDER.map(k=>{
    const s = SCHEMAS[k];
    return `<button class="tab" data-tab="${k}" onclick="switchTab('${k}')">
      <span>${s.icon}</span> ${s.label} <span class="count" id="count_${k}">0</span>
    </button>`;
  }).join('');
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.getElementById('fStatusWrap').style.display = getDispositionsField(SCHEMAS[tab]) ? '' : 'none';
  document.getElementById('fStatus').value = '';
  document.getElementById('addBtn').textContent = '+ Tambah ' + shortLabel(SCHEMAS[tab].label);
  buildHeader();
  renderTable();
  renderStats();
}

function shortLabel(label){
  return label.replace('Nomor ', '');
}

function buildHeader(){
  const s = SCHEMAS[currentTab];
  const th = document.getElementById('theadRow');
  let html = '<tr><th class="no-cell">No</th>';
  s.fields.forEach(f=>{
    if (f.type === 'dispositions'){
      html += `<th>${f.label}</th>`;
    } else {
      html += `<th style="${f.w?('width:'+f.w+';'):''}">${f.label}</th>`;
    }
  });
  html += `<th style="width:70px;">Aksi</th></tr>`;
  th.innerHTML = html;
}

/* =========================================================
   STATS STRIP
   ========================================================= */
function renderStats(){
  const s = SCHEMAS[currentTab];
  const data = state[currentTab];
  const bulanNow = BULAN_LIST[7]; // fallback tidak dipakai langsung
  const totalCount = data.length;
  const dispField = getDispositionsField(s);
  let lengkap = 0, proses = 0;
  if (dispField){
    data.forEach(r=>{
      const done = dispField.items.filter(d=>r[d.k]).length;
      if (done >= dispField.items.length) lengkap++; else proses++;
    });
  }
  const bulanCounts = {};
  data.forEach(r=>{ if (r.periodeBulan) bulanCounts[r.periodeBulan] = (bulanCounts[r.periodeBulan]||0)+1; });
  const bulanTerbanyak = Object.keys(bulanCounts).sort((a,b)=>bulanCounts[b]-bulanCounts[a])[0] || '—';

  const cards = [
    {n: totalCount, l: 'Total ' + shortLabel(s.label)},
  ];
  if (dispField){
    cards.push({n: lengkap, l: 'Disposisi Lengkap'});
    cards.push({n: proses, l: 'Masih Proses'});
  } else {
    cards.push({n: data.filter(r=>r.perihal).length, l: 'Terisi Perihal'});
    cards.push({n: '—', l: 'Disposisi'});
  }
  cards.push({n: bulanTerbanyak, l: 'Bulan Terbanyak'});

  document.getElementById('statsRow').innerHTML = cards.map(c=>
    `<div class="stat"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`
  ).join('');
}

/* =========================================================
   RENDER TABLE
   ========================================================= */
function renderTable(){
  const s = SCHEMAS[currentTab];
  const data = state[currentTab];
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  const bulan = document.getElementById('fBulan').value;
  const status = document.getElementById('fStatus').value;
  const sortDir = document.getElementById('fSort').value;
  const dispField = getDispositionsField(s);

  TAB_ORDER.forEach(k=>{
    const el = document.getElementById('count_'+k);
    if (el) el.textContent = state[k].length;
  });

  let rows = data.filter(r=>{
    if (q){
      const hay = ((r.perihal||'') + ' ' + (r.nomorSurat||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (bulan && r.periodeBulan !== bulan) return false;
    if (status && dispField){
      const total = dispField.items.length;
      const done = dispField.items.filter(d=>r[d.k]).length;
      if (status === 'lengkap' && done < total) return false;
      if (status === 'proses' && done >= total) return false;
    }
    return true;
  });

  rows.sort((a,b)=>{
    const da = a.tanggal || '';
    const db = b.tanggal || '';
    if (da === db) return (a.no||0) - (b.no||0);
    return sortDir === 'asc' ? da.localeCompare(db) : db.localeCompare(da);
  });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  document.getElementById('footerCount').textContent =
    rows.length + ' baris' + (rows.length !== data.length ? ` (dari ${data.length} total)` : '');

  if (!rows.length){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = rows.map(r=>{
    let cells = `<td class="no-cell">${r.no!=null ? r.no : '—'}</td>`;
    s.fields.forEach(f=>{
      if (f.type === 'dispositions'){
        const badges = f.items.map(d=>{
          const on = !!r[d.k];
          return `<span class="badge ${on?'yes':'no'}" title="${d.label}">${on?'✓':'·'}</span>`;
        }).join(' ');
        cells += `<td>${badges}</td>`;
        return;
      }
      const val = r[f.k];
      if (f.k === 'perihal'){
        cells += `<td class="perihal"><div>${escapeHtml(val||'—')}</div></td>`;
      } else if (f.k === 'periodeBulan'){
        cells += `<td>${val ? `<span class="periode-pill">${escapeHtml(val)}</span>` : '—'}</td>`;
      } else if (f.type === 'link'){
        cells += `<td class="link-cell">${renderLinkCell(val)}</td>`;
      } else if (f.mono){
        cells += `<td class="mono">${escapeHtml(val||'—')}</td>`;
      } else if (f.type === 'date'){
        cells += `<td>${val ? escapeHtml(val) : '—'}</td>`;
      } else {
        cells += `<td class="disp-cell">${escapeHtml(val||'—')}</td>`;
      }
    });
    cells += `<td><div class="rowbtns">
        <button class="iconbtn" title="Ubah" onclick="openModal('${r.id}')">✎</button>
        <button class="iconbtn del" title="Hapus" onclick="deleteEntry('${r.id}')">🗑</button>
      </div></td>`;
    return `<tr>${cells}</tr>`;
  }).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* Menampilkan nilai kolom "link" (mis. Draf Surat, Upload Nodis, Disposisi)
   sebagai tautan yang bisa dipencet jika nilainya berupa URL (http/https).
   Jika hanya berupa nama file/teks biasa (belum ada link), tampilkan sebagai
   teks biasa agar user tahu perlu menambahkan link penuh di form. */
function renderLinkCell(val){
  if (!val) return '<span class="link-empty">—</span>';
  const looksLikeUrl = /^https?:\/\//i.test(val.trim());
  if (looksLikeUrl){
    const safeUrl = escapeHtml(val.trim());
    const fname = val.trim().split('/').pop().split('?')[0] || val.trim();
    return `<a class="link-pill" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="${safeUrl}">
      <span>🔗</span><span class="fname">${escapeHtml(fname)}</span>
    </a>`;
  }
  return escapeHtml(val);
}

/* =========================================================
   MODAL / FORM
   ========================================================= */
function openModal(id){
  editingId = id || null;
  const s = SCHEMAS[currentTab];
  const entry = id ? state[currentTab].find(x=>x.id===id) : {};
  document.getElementById('modalTitle').textContent = (id? 'Ubah ' : 'Tambah ') + s.label;
  document.getElementById('modalSub').textContent = s.sheetName;

  let html = '';
  s.fields.forEach(f=>{
    if (f.type === 'dispositions'){
      html += `<div class="checkgroup"><span>${f.label}</span><div class="chk-row">`;
      f.items.forEach(d=>{
        html += `<label class="chk"><input type="checkbox" data-field="${d.k}" ${entry&&entry[d.k]?'checked':''}> ${d.label}</label>`;
      });
      html += `</div></div>`;
      return;
    }
    const full = (f.k === 'perihal' || f.k === 'uploadNodis' || f.k === 'disposisiKabadanSes' || f.k === 'disposisiKapuskomcad' || f.k === 'drafSebelum' || f.k === 'drafSesudah') ? ' full' : '';
    if (f.type === 'select'){
      html += `<div class="field-group${full}"><label>${f.label}</label>
        <select data-field="${f.k}">
          <option value="">— pilih —</option>
          ${f.options.map(o=>`<option value="${o}" ${entry&&entry[f.k]===o?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
    } else if (f.type === 'link'){
      html += `<div class="field-group${full}"><label>${f.label}</label>
        <input type="text" placeholder="Tempel link di sini (https://...)" data-field="${f.k}" value="${entry&&entry[f.k]?escapeHtml(entry[f.k]):''}"></div>`;
    } else {
      const type = f.type === 'date' ? 'date' : 'text';
      html += `<div class="field-group${full}"><label>${f.label}</label>
        <input type="${type}" data-field="${f.k}" value="${entry&&entry[f.k]?escapeHtml(entry[f.k]):''}"></div>`;
    }
  });
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

async function saveEntry(){
  const s = SCHEMAS[currentTab];
  const body = document.getElementById('modalBody');
  const fields = body.querySelectorAll('[data-field]');
  const obj = {};
  fields.forEach(el=>{
    if (el.type === 'checkbox') obj[el.dataset.field] = el.checked;
    else obj[el.dataset.field] = el.value.trim();
  });

  const reqField = s.fields.find(f=>f.required);
  if (reqField && !obj[reqField.k]){
    showToast(`${reqField.label} wajib diisi`);
    return;
  }

  if (editingId){
    const idx = state[currentTab].findIndex(x=>x.id===editingId);
    state[currentTab][idx] = {...state[currentTab][idx], ...obj};
  } else {
    obj.id = uid();
    obj.no = state[currentTab].length + 1;
    state[currentTab].push(obj);
  }
  await persist(currentTab);
  closeModal();
  renderTable();
  renderStats();
  showToast(editingId ? 'Perubahan disimpan' : 'Surat ditambahkan');
}

async function deleteEntry(id){
  if (!confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.')) return;
  state[currentTab] = state[currentTab].filter(x=>x.id!==id);
  await persist(currentTab);
  renderTable();
  renderStats();
  showToast('Data dihapus');
}

/* =========================================================
   CSV EXPORT — kolom & urutan persis seperti sheet Excel
   ========================================================= */
function exportCSV(){
  const s = SCHEMAS[currentTab];
  const cols = ['no'];
  const headers = ['No'];
  s.fields.forEach(f=>{
    if (f.type === 'dispositions'){
      f.items.forEach(d=>{ cols.push(d.k); headers.push(d.label); });
    } else {
      cols.push(f.k); headers.push(f.label);
    }
  });
  const rows = state[currentTab].map(r=> cols.map(k=>{
    let v = r[k];
    if (typeof v === 'boolean') v = v ? 'Ya' : 'Tidak';
    v = (v===undefined||v===null) ? '' : String(v);
    return `"${v.replace(/"/g,'""')}"`;
  }).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${s.label.replace(/\s+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV diunduh');
}

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

document.getElementById('overlay').addEventListener('click', e=>{
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape') closeModal();
});

init();
</script>
